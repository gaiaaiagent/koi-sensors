# Claude Sessions Sensor - Personal Configuration
# Indexes Claude Code session transcripts into personal KOI

sensor:
  name: claude_sessions
  description: "Claude Code session transcript indexer"
  version: "1.0.0"

# Session file locations
sessions:
  # Multi-host base paths (Phase 5b). Each entry tags the sessions it
  # discovers with a host_tag that becomes session_ingestion_log.source_host.
  # Legacy key `base_path` (string) still supported by _iter_base_paths().
  base_paths:
    - {path: "~/.claude/projects",     host_tag: "macbook"}
    - {path: "~/.claude/nuc-projects", host_tag: "dobby"}
  pattern: "**/*.jsonl"
  exclude:
    - "**/scratchpad/**"

# Processing configuration
processing:
  # Chunking strategy: "turn_pair" or "token_count"
  chunk_strategy: "turn_pair"
  # For token_count strategy
  chunk_size: 1000
  chunk_overlap: 200
  # Minimum message count to process a session
  min_messages: 2
  # Maximum age of sessions to process (days, 0 = no limit)
  max_age_days: 0

# Embedding configuration
embeddings:
  enabled: true
  model: "Qwen/Qwen3-Embedding-0.6B"
  # Batch size for embedding API calls
  batch_size: 5
  api_base: "http://10.100.0.1:8352"
  api_key: "not-needed"

# Entity extraction (Phase 2) — uses claude -p subprocess, zero $ API cost.
# The old OpenAI gpt-4o-mini path is superseded; extraction now reads the
# canonical prompt from extractor_prompt_path and calls claude -p.
entity_extraction:
  enabled: true
  # Absolute path to the shared prompt file (sensor + skill + backfill).
  extractor_prompt: "/Users/darrenzal/projects/darren-workflow/skills/extract-session-entities/extractor-prompt.md"
  # Claude CLI binary (macOS; on NUC it's /usr/bin/claude but NUC doesn't run extraction — §2a constraint).
  claude_binary: "/Users/darrenzal/.local/bin/claude"
  # Per-session timeout for claude -p subprocess (seconds).
  timeout: 120
  # Max sessions to extract per scan cycle (keeps scan < 5 min budget).
  max_per_cycle: 5
  # Terminal retry limit per session (plan §2c.1).
  max_attempts: 5
  # Legacy flags (kept for backward compat but not used by the new path):
  link_existing: true
  extract_new: false
  model: "gpt-4o-mini"
  max_chunks: 5

# Personal KOI backend
koi_backend:
  # Override via PERSONAL_KOI_API_URL / KOI_API_URL / KOI_BACKEND_URL
  api_url: "http://localhost:8351"
  # Override via PERSONAL_KOI_DB_URL / KOI_DATABASE_URL / DATABASE_URL
  # Example with credentials: postgresql://postgres:postgres@localhost:5432/personal_koi
  database_url: "postgresql://localhost:5432/personal_koi"

# Sensor runtime
runtime:
  # How often to run full scan (minutes)
  scan_interval: 10
  # Run as daemon or one-shot
  mode: "daemon"
  # Log level
  log_level: "INFO"

# Hook integration
hook:
  # Enable real-time processing via SessionEnd hook
  enabled: true
  # Endpoint for hook notifications
  endpoint: "/ingest-session"
