# File patterns to index
doc_extensions:
  - "*.md"
  - "*.MD" 
  - "*.mdx"
  - "*.rst"
  - "*.txt"
  - "*.asciidoc"
  - "*.json"
  - "*.yaml"
  - "*.yml"
  - "*.toml"
  - "*.ini"
  - "*.cfg"
  - "LICENSE*"
  - "COPYRIGHT*"
  - "NOTICE*"
  - "README*"
  - "CHANGELOG*"
  - "CONTRIBUTING*"

# Directories to exclude
excluded_dirs:
  - node_modules
  - vendor
  - dist
  - build
  - .git
  - __pycache__
  - .pytest_cache
  - coverage
  - .next
  - out
  - target
  - bin
  - .vscode
  - .idea

# Processing settings
processing:
  request_delay: 1.0  # Seconds between requests
  timeout: 60  # Request timeout in seconds
  retry_attempts: 3
  clone_timeout: 60  # Git clone timeout in seconds

# Content detection
content_detection:
  content_threshold: 50  # Minimum content length to process
  detect_changes: true
  ignore_binary_files: true

# Logging
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"