version: '3.8'

services:
  website-sensor:
    build: .
    container_name: koi-website-sensor
    restart: unless-stopped
    
    # Environment variables
    environment:
      - KOI_COORDINATOR_URL=http://koi-coordinator:8000
      - PYTHONPATH=/app
    
    # Mount config file
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
    
    # Network for KOI sensors
    networks:
      - koi-network
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  koi-network:
    external: true